name: Deploy Docker App to EC2

on:
  workflow_run:
    workflows: ["Build and Push Docker Image to Amazon ECR"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.111.218.244
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            aws ecr get-login-password --region ap-south-1 | docker login \
              --username AWS \
              --password-stdin 594474086887.dkr.ecr.ap-south-1.amazonaws.com

            docker pull 594474086887.dkr.ecr.ap-south-1.amazonaws.com/python-devops-app:latest

            docker rm -f python-devops-app || true

            docker run -d \
              --restart unless-stopped \
              --name python-devops-app \
              -p 5000:5000 \
              594474086887.dkr.ecr.ap-south-1.amazonaws.com/python-devops-app:latest
